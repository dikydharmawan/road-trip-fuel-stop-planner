<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perencana Pengisian Bahan Bakar Perjalanan Darat</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header>
    <h1>Perencana Pengisian Bahan Bakar</h1>
    <p>Hitung kebutuhan pengisian bahan bakar untuk perjalanan darat Anda</p>
  </header>

  <div class="unit-toggle">
    <button id="btnImperial" class="active" type="button">Imperial (mil/gal)</button>
    <button id="btnMetric" type="button">Metrik (km/L)</button>
  </div>

  <div class="inputs-grid">
    <div class="input-group">
      <label for="tripDistance">Jarak Total Perjalanan</label>
      <div class="input-row">
        <input type="number" id="tripDistance" value="500" min="1" step="10">
        <input type="range" id="tripDistanceSlider" min="10" max="5000" value="500" step="10">
        <span class="unit-label" id="unitDistance">mil</span>
      </div>
    </div>

    <div class="input-group">
      <label for="tankSize">Ukuran Tangki Bahan Bakar</label>
      <div class="input-row">
        <input type="number" id="tankSize" value="15" min="1" max="200" step="0.5">
        <input type="range" id="tankSizeSlider" min="5" max="200" value="15" step="0.5">
        <span class="unit-label" id="unitTank">galon</span>
      </div>
    </div>

    <div class="input-group">
      <label for="fuelEfficiency">Efisiensi Bahan Bakar</label>
      <div class="input-row">
        <input type="number" id="fuelEfficiency" value="30" min="1" max="150" step="0.5">
        <input type="range" id="fuelEfficiencySlider" min="5" max="150" value="30" step="0.5">
        <span class="unit-label" id="unitEfficiency">MPG</span>
      </div>
    </div>
  </div>

  <div class="fuel-bar-container fuel-level-group">
    <label for="fuelLevel">Tingkat Bahan Bakar Saat Ini</label>
    <div class="fuel-visual">
      <div class="fuel-fill" id="fuelFill" style="width:75%; background: linear-gradient(90deg, #4ade80, #22d3ee);">
        <span id="fuelFillText">75%</span>
      </div>
    </div>
    <div class="fuel-slider-row">
      <input type="range" id="fuelLevel" min="0" max="100" value="75" step="1">
      <span class="fuel-pct" id="fuelPct">75%</span>
    </div>
  </div>

  <div class="results-section">
    <div class="results-grid">
      <div class="result-card range-card">
        <div class="result-label">Jarak Tempuh Saat Ini</div>
        <div class="result-value" id="currentRange">0</div>
        <div class="result-unit" id="currentRangeUnit"></div>
      </div>
      <div class="result-card stops-card">
        <div class="result-label">Pengisian Dibutuhkan</div>
        <div class="result-value" id="stopsNeeded">0</div>
        <div class="result-unit" id="stopsNeededUnit">kali pengisian</div>
      </div>
      <div class="result-card interval-card">
        <div class="result-label">Interval Pemberhentian</div>
        <div class="result-value" id="stopInterval">0</div>
        <div class="result-unit" id="stopIntervalUnit"></div>
      </div>
    </div>

    <div class="trip-visual">
      <h3>Peta Perjalanan</h3>
      <div class="road-map" id="roadMap"></div>
      <div id="pumpSection"></div>
      <div class="note-box" id="noteBox"></div>
    </div>
  </div>

  <footer>Perencana Pengisian Bahan Bakar — Hitungan bersifat estimasi</footer>
</div>

<script src="script.js"></script>
</body>
</html>
